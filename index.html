<head>

<title>Muqtada Al-Khamees Portfolio</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
#fullscreenimage {
    width: 100%;
}
html {
    scroll-behavior: smooth;
}
body {
    font-family: Arial, sans-serif;
    background-color: #0f0f0f;
    color: #f5f5f5;
    padding-bottom: 100px;
}
.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}
#nav-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: #0f0f0f;
    padding: 10px 15px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    border-bottom: 1px solid #222;
    z-index: 1000;
}
.nav-link {
    text-decoration: none;
    color: #f5f5f5;
    padding: 8px;
    border-radius: 50%;
    transition: 0.3s;
}
.nav-link:hover {
    background-color: #2a2a2a;
    transform: scale(1.05);
}
#lang-btn {
    margin-left: auto;
    background-color: #252525;
    color: white;
    border: 1px solid #555;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
}
#lang-btn:hover {
    background-color: #444;
}
#hero {
    padding-top: 30px;
    text-align: center;
    background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url("img/5d0f6387aa4f4955bca43823f4ffac0d.gif");
    background-size: cover;
    background-position: center;
}
#myimg {
    width: 100px;
    border-radius: 50%;
    margin-top: 50px;
}
#hero h1 {
    padding: 10px 0;
    font-size: 1rem;
}
#myjob {
    font-size: 0.8rem;
}
section {
    padding: 60px 20px;
}
h2 {
    margin-bottom: 20px;
}
#footer-line {
    height: 2px;
    background-color: #444;
}
footer {
    text-align: center;
    padding: 20px;
    color: #aaa;
}
.contact-btn {
    width: 20px;
}
#contactlist {
    display: flex;
    gap: 15px;
}
/* Arabic adjustments */
body[dir="rtl"] {
    font-family: Tahoma, Arial, sans-serif;
}
body[dir="rtl"] #nav-bar {
    flex-direction: row-reverse;
}
body[dir="rtl"] #lang-btn {
    margin-left: 0;
    margin-right: auto;
}
body[dir="rtl"] section {
    text-align: right;
}
body[dir="rtl"] #hero {
    text-align: center;
}
body[dir="rtl"] #contactlist {
    flex-direction: row;
}
@media (max-width: 600px) {
    #nav-bar {
        flex-wrap: wrap;
    }
}
</style>
</head>

<script>
// Current language
let currentLang = localStorage.getItem("language") || "en";
// Switch language
function switchLanguage() {
    currentLang = currentLang === "en" ? "ar" : "en";
    localStorage.setItem("language", currentLang);
    updateLanguage();
}
// Update all translated elements
function updateLanguage() {
    document.documentElement.lang = currentLang;
    document.body.dir = currentLang === "ar" ? "rtl" : "ltr";
    // Change all elements with translation attributes
    document.querySelectorAll("[data-en][data-ar]").forEach(element => {
        element.textContent = element.getAttribute(
            currentLang === "ar" ? "data-ar" : "data-en"
        );
    });
    // Update language button
document.getElementById("lang-btn").textContent =
        currentLang === "ar" ? "English" : "العربية";
    // Update job title document.getElementById("myjob").textContent =
        currentLang === "ar" ? "مهندس برمجيات" : "Software Engineer";
    // Update image navigation accessibility labels
    document.getElementById("home-icon").alt =
        currentLang === "ar" ? "الرئيسية" : "Home";

    document.getElementById("about-icon").alt =
        currentLang === "ar" ? "نبذة عني" : "About";
 document.getElementById("contact-icon").alt =
        currentLang === "ar" ? "التواصل" : "Contact";
    // Update page title
    document.title = currentLang === "ar"
        ? "الcv الخاص بمقتدى الخميس"
        : "Muqtada Al-Khamees Portfolio";
}
// Scroll to section
function scrollToSection(id) {
 document.getElementById(id).scrollIntoView({
        behavior: "smooth"
    });
}
// Apply saved language on page load
updateLanguage();
// Fullscreen profile picture
document.getElementById("myimg").addEventListener("click", function () {
    if (this.requestFullscreen) {
        this.requestFullscreen();
    }
});
</script>
